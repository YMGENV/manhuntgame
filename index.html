<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>City Hide &amp; Seek 3D</title>
<style>
:root{--bg:#0a1424;--ink:#eef3fb;--amber:#ffb02e;--cyan:#38d6ff;--red:#ff4d4d;--panel:rgba(10,20,36,.82)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
#map{position:fixed;left:-10%;top:-10%;width:120%;height:120%;animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.06)}}
#mapShade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(10,20,36,.25),rgba(10,20,36,.88) 75%)}
.pin{position:fixed;width:14px;height:14px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,176,46,.7);animation:ping 2.4s infinite}
@keyframes ping{70%{box-shadow:0 0 0 18px rgba(255,176,46,0)}100%{box-shadow:0 0 0 0 rgba(255,176,46,0)}}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:none}
.screen{z-index:5;position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.screen.on{display:flex}
h1{font-size:clamp(34px,8vw,68px);line-height:1;letter-spacing:-.02em;text-shadow:0 4px 30px #000}
h1 span{color:var(--amber)}
.sub{opacity:.8;max-width:34ch}
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;width:min(92vw,380px)}
button,input{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:18px;cursor:pointer;background:var(--amber);color:#1a1100;touch-action:manipulation}
button.alt{background:rgba(255,255,255,.12);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:13px;font-size:18px;text-align:center;user-select:text;-webkit-user-select:text}
#code{letter-spacing:.5em;font-size:26px}
#err{color:#ff9a9a;min-height:1.2em;font-size:15px}
.big{font-size:60px;font-weight:800;letter-spacing:.18em;color:var(--amber)}
#plist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
#plist li{background:rgba(255,255,255,.08);border-radius:10px;padding:8px}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none;display:none}
#hud.on{display:block}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;align-items:center}
#top>*{background:var(--panel);padding:6px 14px;border-radius:999px}
#timer{font-size:26px;font-variant-numeric:tabular-nums}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.7}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .3s;white-space:nowrap}
#banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,5vw,44px);font-weight:800;padding:20px}
#banner.blind{background:rgba(0,0,0,.96)}
#tagBtn{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;background:var(--red);color:#fff;pointer-events:auto;display:none}
#joy{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.5)}
#hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;opacity:.85;font-size:15px}
</style></head><body>
<canvas id="map"></canvas><div id="mapShade"></div>
<div class="pin" style="left:22%;top:30%"></div><div class="pin" style="left:68%;top:22%;animation-delay:.8s"></div><div class="pin" style="left:52%;top:72%;animation-delay:1.6s"></div>

<div class="screen on" id="home">
 <h1>City <span>Hide &amp; Seek</span></h1>
 <p class="sub">One seeker. Five minutes. A whole city to disappear into.</p>
 <div class="card">
  <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
  <button id="mk">Make room</button>
  <button id="jn" class="alt">Join room</button>
  <div id="joinBox" style="display:none;flex-direction:column;gap:10px">
   <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
   <button id="go">Join</button>
  </div>
  <div id="err" role="alert"></div>
 </div>
</div>

<div class="screen" id="lobby">
 <p class="sub">Room code - friends type this to join</p>
 <div class="big" id="roomCode">----</div>
 <div class="card"><ul id="plist"></ul>
  <button id="start">Start round</button><div id="wait" class="sub" style="display:none;max-width:none">Waiting for the host to start...</div>
  <button id="leave" class="alt">Leave</button></div>
</div>

<div class="screen" id="end" style="background:rgba(5,10,20,.78)">
 <h1 id="endT">Round over</h1><p class="sub" id="endS"></p>
 <button id="back">Back to lobby</button><div id="endW" class="sub">Waiting for the host...</div>
</div>

<canvas id="game"></canvas>
<div id="hud">
 <div id="top"><span id="role"></span><b id="timer">5:00</b><span id="cnt"></span></div>
 <div id="cross"></div><div id="toast"></div><div id="banner"></div>
 <button id="tagBtn">Tag</button><div id="joy"><i></i></div><div id="hint"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const PREFIX='cityhs-v1-',HIDE=20,SEEK=300,MAXP=8;
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- home map (2D city) ---------- */
function drawMap(){
 const c=$('map'),x=c.getContext('2d'),w=c.width=Math.round(innerWidth*1.2),h=c.height=Math.round(innerHeight*1.2),r=rng(11);
 x.fillStyle='#0c1a2e';x.fillRect(0,0,w,h);
 const cell=96,road=28;
 for(let i=0;i*cell<w;i++)for(let j=0;j*cell<h;j++){
  const px=i*cell+road/2,py=j*cell+road/2,s=cell-road,k=r();
  x.fillStyle=k<.13?'#133d2c':'#15263f';x.fillRect(px,py,s,s);
  if(k>=.13)for(let a=0;a<4;a++)if(r()<.82){x.fillStyle=r()<.5?'#1e3558':'#274a76';x.fillRect(px+4+(a%2)*s/2,py+4+(a>>1)*s/2,s/2-8,s/2-8)}
 }
 x.strokeStyle='#1b64a8';x.lineWidth=40;x.lineCap='round';x.beginPath();x.moveTo(-30,h*.32);x.bezierCurveTo(w*.3,h*.05,w*.55,h*.75,w+30,h*.5);x.stroke();
 x.strokeStyle='rgba(255,176,46,.4)';x.lineWidth=3;
 for(let i=2;i*cell<w;i+=4){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,h);x.stroke()}
 x.fillStyle='rgba(238,243,251,.55)';x.font='600 20px "Trebuchet MS",sans-serif';
 x.fillText('Riverside',w*.12,h*.2);x.fillText('Old Town',w*.64,h*.16);x.fillText('Central Park',w*.46,h*.7);
}
drawMap();addEventListener('resize',drawMap);

/* ---------- state ---------- */
let peer=null,isHost=false,conns={},hostConn=null,myId=0,nextId=1,players={},code='',name='';
let phase='lobby',tl=0,phaseEnd=0,seekerId=-1,round=0,inGame=false,tickH=null,hudT=0;
let px=0,pz=0,yaw=0,pitch=0,jx=0,jy=0,found=false;
const keys={};

function show(id){['home','lobby','end'].forEach(s=>$(s).classList.toggle('on',s===id));$('map').style.display=$('mapShade').style.display=(id==='game'?'none':'');document.querySelectorAll('.pin').forEach(p=>p.style.display=id==='home'?'':'none')}
function setErr(m){$('err').textContent=m||''}
function cleanup(){
 clearInterval(tickH);tickH=null;inGame=false;
 try{Object.values(conns).forEach(c=>c.close())}catch(e){}
 try{hostConn&&hostConn.close()}catch(e){}
 try{peer&&peer.destroy()}catch(e){}
 peer=null;conns={};hostConn=null;players={};isHost=false;
 $('game').style.display='none';$('hud').classList.remove('on');
 if(document.pointerLockElement)document.exitPointerLock();
}
function fail(m){cleanup();show('home');setErr(m)}
function getName(){return($('name').value.trim()||'Player'+(Math.floor(Math.random()*90)+10)).slice(0,12)}

/* ---------- networking ---------- */
function makeRoom(){
 setErr('');name=getName();
 const attempt=n=>{
  code=String(1000+Math.floor(Math.random()*9000));
  const p=peer=new Peer(PREFIX+code);
  p.on('open',()=>{isHost=true;myId=0;nextId=1;players={0:newP(0,name)};phase='lobby';renderLobby();show('lobby')});
  p.on('connection',onGuest);
  p.on('error',e=>{
   if(p!==peer)return;
   if(e.type==='unavailable-id'&&n<6){try{p.destroy()}catch(_){}attempt(n+1)}
   else if(inGame||$('lobby').classList.contains('on')){toast('Network issue: '+e.type)}
   else fail('Could not create a room ('+e.type+'). Check your connection.');
  });
 };
 attempt(0);
}
function joinRoom(){
 setErr('');name=getName();code=$('code').value.replace(/\D/g,'');
 if(code.length!==4){setErr('Enter the 4-digit room code.');return}
 let opened=false;const p=peer=new Peer();
 p.on('open',()=>{
  const c=hostConn=p.connect(PREFIX+code,{reliable:true,serialization:'json'});
  c.on('open',()=>{opened=true;c.send({t:'hello',name})});
  c.on('data',onHost);
  c.on('close',()=>{if(opened&&peer===p)fail('The host left the room.')});
  setTimeout(()=>{if(!opened&&peer===p)fail('Room not found. Check the code and try again.')},9000);
 });
 p.on('error',e=>{if(p!==peer)return;fail(e.type==='peer-unavailable'?'Room not found. Check the code.':'Connection error ('+e.type+').')});
}
function newP(id,nm){return{id,name:nm,x:0,z:0,ry:0,tx:0,tz:0,tr:0,found:false,mesh:null}}
function bcast(m){Object.values(conns).forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function lobbyMsg(){return{t:'lobby',list:Object.values(players).map(p=>({id:p.id,name:p.name}))}}

function onGuest(c){
 let id=null;
 c.on('data',m=>{
  if(m.t==='hello'){
   if(phase!=='lobby'){c.send({t:'full',msg:'A round is in progress. Try again soon.'});setTimeout(()=>c.close(),400);return}
   if(Object.keys(players).length>=MAXP){c.send({t:'full',msg:'Room is full.'});setTimeout(()=>c.close(),400);return}
   id=nextId++;conns[id]=c;players[id]=newP(id,String(m.name||'Player').slice(0,12));
   c.send({t:'you',id});bcast(lobbyMsg());renderLobby();
  }else if(id!==null&&players[id]){
   const p=players[id];
   if(m.t==='p'&&isFinite(m.x)&&isFinite(m.z)){p.tx=m.x;p.tz=m.z;p.tr=m.r}
   else if(m.t==='tag')hostTag(id);
  }
 });
 c.on('close',()=>{if(id!==null)dropPlayer(id)});
}
function dropPlayer(id){
 const was=players[id];if(!was)return;delete players[id];delete conns[id];
 if(was.mesh)avatars.remove(was.mesh);
 if(phase==='lobby'){bcast(lobbyMsg());renderLobby()}
 else if(phase==='hide'||phase==='seek'){
  bcast({t:'ev',txt:was.name+' left'});toast(was.name+' left');
  if(id===seekerId)endRound('hiders','The seeker left.');else checkAllFound();
 }
}
function onHost(m){
 switch(m.t){
  case 'you':myId=m.id;break;
  case 'full':fail(m.msg);break;
  case 'lobby':
   players=Object.fromEntries(m.list.map(p=>[p.id,newP(p.id,p.name)]));
   if(inGame||phase==='over'){leaveGame()}
   phase='lobby';renderLobby();show('lobby');break;
  case 'start':beginRound(m);break;
  case 'st':applyState(m);break;
  case 'ev':toast(m.txt);break;
  case 'end':showEnd(m.winner,m.why);break;
 }
}
function applyState(m){
 if(!inGame)return;
 phase=m.ph;tl=m.tl;
 for(const id in m.p){
  const p=players[id],d=m.p[id];if(!p)continue;
  if(+id===myId){if(d[3]&&!found){found=true;toast('You were found! Spectating.')}continue}
  p.tx=d[0];p.tz=d[1];p.tr=d[2];p.found=!!d[3];
 }
}

/* ---------- host game logic ---------- */
function startRound(){
 if(Object.keys(players).length<2)return;
 round++;const ids=Object.keys(players).map(Number);seekerId=ids[(round-1)%ids.length];
 const seed=1+Math.floor(Math.random()*1e9),sp={};
 ids.forEach(id=>{const lane=ROAD_C[Math.floor(Math.random()*ROAD_C.length)],al=MINC+Math.random()*(MAXC-MINC);
  sp[id]=id===seekerId?[ROAD_C[2],ROAD_C[3]]:(Math.random()<.5?[lane,al]:[al,lane])});
 phaseEnd=performance.now()+HIDE*1000;
 const msg={t:'start',seed,seeker:seekerId,round,sp,list:ids.map(i=>({id:i,name:players[i].name}))};
 bcast(msg);beginRound(msg);
 clearInterval(tickH);tickH=setInterval(hostTick,66);
}
function hostTick(){
 if(!inGame)return;
 const now=performance.now();
 if(phase==='hide'&&now>=phaseEnd){phase='seek';phaseEnd=now+SEEK*1000;bcast({t:'ev',txt:'The seeker is loose!'});toast('The seeker is loose!')}
 else if(phase==='seek'&&now>=phaseEnd){endRound('hiders','Time ran out - the hiders survived!');return}
 if(phase!=='hide'&&phase!=='seek')return;
 if(players[0].found&&!found){found=true;toast('You were found! Spectating.')}
 tl=Math.max(0,(phaseEnd-now)/1000);
 const s={};for(const id in players){const p=players[id],q=P(p);s[id]=[+q[0].toFixed(2),+q[1].toFixed(2),+q[2].toFixed(2),p.found?1:0]}
 bcast({t:'st',ph:phase,tl,p:s});
}
function P(p){return p.id===0?[px,pz,yaw]:[p.tx,p.tz,p.tr]}
function hostTag(sid){
 if(sid!==seekerId||phase!=='seek')return;
 const s=P(players[sid]);let best=null,bd=3.6;
 for(const id in players){const p=players[id];if(+id===sid||p.found)continue;
  const q=P(p),dx=q[0]-s[0],dz=q[1]-s[1],d=Math.hypot(dx,dz),dot=d<.01?1:(dx*-Math.sin(s[2])+dz*-Math.cos(s[2]))/d;
  if(d<bd&&(d<1.6||dot>.25)){best=p;bd=d}}
 if(best){best.found=true;const t=best.name+' was found!';bcast({t:'ev',txt:t});toast(t);checkAllFound()}
 else if(sid===0)toast('Nobody within reach');else conns[sid]&&conns[sid].send({t:'ev',txt:'Nobody within reach'});
}
function checkAllFound(){
 const h=Object.values(players).filter(p=>p.id!==seekerId);
 if(h.length&&h.every(p=>p.found))endRound('seeker','Every hider was found!');
}
function endRound(winner,why){
 if(phase==='over')return;phase='over';
 bcast({t:'end',winner,why});showEnd(winner,why);
}
function showEnd(winner,why){
 phase='over';if(document.pointerLockElement)document.exitPointerLock();
 const me=myId===seekerId,won=(winner==='seeker')===me;
 $('endT').textContent=won?'You win!':'You lose';$('endS').textContent=why||'';
 $('back').style.display=isHost?'':'none';$('endW').style.display=isHost?'none':'';
 $('end').classList.add('on');
}

/* ---------- lobby UI ---------- */
function renderLobby(){
 $('roomCode').textContent=code;
 $('plist').innerHTML='';
 Object.values(players).forEach(p=>{const li=document.createElement('li');li.textContent=p.name+(p.id===0?' (host)':'')+(p.id===myId?' - you':'');$('plist').appendChild(li)});
 $('start').style.display=isHost?'':'none';$('wait').style.display=isHost?'none':'';
 $('start').disabled=Object.keys(players).length<2;
 $('start').textContent=Object.keys(players).length<2?'Need 2+ players':'Start round';
}
function leaveGame(){inGame=false;$('game').style.display='none';$('hud').classList.remove('on');$('end').classList.remove('on');if(document.pointerLockElement)document.exitPointerLock()}

/* ---------- 3D world ---------- */
const N=5,BS=40,RD=14,CELL=BS+RD,O=-(N*CELL+RD)/2,LIM=-O-1;
const ROAD_C=[];for(let i=0;i<=N;i++)ROAD_C.push(O+i*CELL+RD/2);
const MINC=O+3,MAXC=-O-3;
let renderer,scene,camera,sun,world=null,obst=[],cache={},avatars=new THREE.Group(),clock=0;
function initGL(){
 if(renderer)return;
 const cv=$('game');renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!TOUCH,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.6:2));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc6d9ec,70,360);
 const sc=document.createElement('canvas');sc.width=2;sc.height=256;const g=sc.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#3d78c4');gr.addColorStop(.55,'#9cc3ea');gr.addColorStop(1,'#e8dcc8');g.fillStyle=gr;g.fillRect(0,0,2,256);
 const st=new THREE.CanvasTexture(sc);st.encoding=THREE.sRGBEncoding;scene.background=st;
 camera=new THREE.PerspectiveCamera(72,1,.1,700);camera.rotation.order='YXZ';
 scene.add(new THREE.HemisphereLight(0xcfe3ff,0x56633f,.8));
 sun=new THREE.DirectionalLight(0xfff0d2,1.4);sun.castShadow=true;
 const ss=TOUCH?1024:2048;sun.shadow.mapSize.set(ss,ss);
 Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:260});sun.shadow.bias=-.0004;
 scene.add(sun,sun.target,avatars);
 resize();addEventListener('resize',resize);
}
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t}
function mats(){
 if(cache.ok)return cache;
 const rr=rng(5);
 cache.win=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#dfe3ea';g.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=rr()<.2?'#ffe6a0':'#2a3b55';g.fillRect(8+i*14,8+j*14,9,9)}});
 cache.road=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#3a3d43';g.fillRect(0,0,w,h);g.fillStyle='#e8c34a';g.fillRect(0,30,34,4)});
 cache.road.repeat.set(-O*2/8,1);cache.roadMat=new THREE.MeshStandardMaterial({map:cache.road,roughness:.9});
 cache.bld=[0xc9b9a6,0x9fb4c8,0xb98f7f,0x8fa7a0,0xd2c7b0,0x8d94a6].map(c=>new THREE.MeshStandardMaterial({map:cache.win,color:c,roughness:.75,metalness:.05}));
 cache.pad=new THREE.MeshStandardMaterial({color:0x8d9097,roughness:.95});
 cache.grass=new THREE.MeshStandardMaterial({color:0x4c7a3a,roughness:1});
 cache.crate=[0xb07a3c,0x3b6ea5,0x9a3d3d].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}));
 cache.ok=true;return cache;
}
function buildWorld(seed){
 const M=mats(),r=rng(seed);
 if(world){scene.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
 world=new THREE.Group();obst=[];const trees=[];
 const add=(geo,mat,x,y,z,sh=true)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=sh;m.receiveShadow=true;world.add(m);return m};
 const gnd=add(new THREE.PlaneGeometry(1400,1400),M.grass,0,-.02,0,false);gnd.rotation.x=-Math.PI/2;
 const rl=-O*2;
 [0,1].forEach(o=>{
  const mat=M.roadMat;
  ROAD_C.forEach(c=>{const m=add(new THREE.PlaneGeometry(rl,RD),mat,o?c:0,.01+o*.03,o?0:c,false);m.rotation.x=-Math.PI/2;if(o)m.rotation.z=Math.PI/2})});
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const bx=O+i*CELL+RD,bz=O+j*CELL+RD,cx=bx+BS/2,cz=bz+BS/2,park=r()<.28;
  add(new THREE.BoxGeometry(BS,.3,BS),park?M.grass:M.pad,cx,.14,cz,false);
  if(park){
   for(let k=0;k<14;k++){const tx=bx+3+r()*(BS-6),tz=bz+3+r()*(BS-6),s=.8+r()*.7;trees.push([tx,tz,s]);obst.push({x:tx,z:tz,r:.4*s})}
   for(let k=0;k<5;k++){const x=bx+4+r()*(BS-8),z=bz+4+r()*(BS-8),s=1.4+r()*1.2;add(new THREE.BoxGeometry(s,s,s),M.crate[k%3],x,s/2+.3,z);obst.push({x0:x-s/2,x1:x+s/2,z0:z-s/2,z1:z+s/2})}
   continue}
  for(let a=0;a<2;a++)for(let b=0;b<2;b++){
   const lx=bx+a*BS/2+1.5,lz=bz+b*BS/2+1.5,sz=BS/2-3;
   if(r()<.85){
    const h=10+Math.pow(r(),1.6)*40,geo=new THREE.BoxGeometry(sz,h,sz),uv=geo.attributes.uv;
    for(let v=0;v<uv.count;v++){const f=Math.floor(v/4);
     if(f<2||f>3){uv.setXY(v,uv.getX(v)*sz/5,uv.getY(v)*h/5)}else uv.setXY(v,uv.getX(v)*.05,uv.getY(v)*.05)}
    add(geo,M.bld[Math.floor(r()*6)],lx+sz/2,h/2+.3,lz+sz/2);
    obst.push({x0:lx,x1:lx+sz,z0:lz,z1:lz+sz});
   }else{
    for(let k=0;k<3;k++){const s=1.3+r()*1.3,x=lx+2+r()*(sz-4),z=lz+2+r()*(sz-4);add(new THREE.BoxGeometry(s,s,s),M.crate[k%3],x,s/2+.3,z);obst.push({x0:x-s/2,x1:x+s/2,z0:z-s/2,z1:z+s/2})}
    const tx=lx+sz/2,tz=lz+sz/2;trees.push([tx,tz,1.1]);obst.push({x:tx,z:tz,r:.45});
   }
  }
 }
 for(let k=0;k<26;k++){ // parked cars
  const ax=r()<.5,c=ROAD_C[Math.floor(r()*ROAD_C.length)]+(r()<.5?-3.6:3.6),al=O+6+r()*(-O*2-12),col=new THREE.Color().setHSL(r(),.55,.45);
  const g=new THREE.Group(),bm=new THREE.MeshStandardMaterial({color:col,roughness:.4,metalness:.5});
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.8,4.2),bm),cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,.7,2.2),new THREE.MeshStandardMaterial({color:0x1b2430,roughness:.2,metalness:.6}));
  body.position.y=.65;cab.position.set(0,1.38,-.2);body.castShadow=cab.castShadow=true;g.add(body,cab);
  g.position.set(ax?al:c,0,ax?c:al);if(ax)g.rotation.y=Math.PI/2;world.add(g);
  obst.push(ax?{x0:al-2.2,x1:al+2.2,z0:c-1,z1:c+1}:{x0:c-1,x1:c+1,z0:al-2.2,z1:al+2.2});
 }
 const T=trees.length,trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.22,.32,2.6,7),new THREE.MeshStandardMaterial({color:0x5a3d26}),T);
 const leaf=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.7,1),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.9,flatShading:true}),T),d=new THREE.Object3D(),col=new THREE.Color();
 trees.forEach((t,i)=>{d.position.set(t[0],1.3*t[2]+.28,t[1]);d.scale.setScalar(t[2]);d.updateMatrix();trunk.setMatrixAt(i,d.matrix);
  d.position.y=3.9*t[2];d.scale.set(t[2],t[2]*1.25,t[2]);d.updateMatrix();leaf.setMatrixAt(i,d.matrix);leaf.setColorAt(i,col.setHSL(.27+r()*.08,.5,.28+r()*.1))});
 trunk.castShadow=leaf.castShadow=true;trunk.receiveShadow=leaf.receiveShadow=true;world.add(trunk,leaf);
 for(let k=0;k<16;k++){const a=k/16*Math.PI*2,m=new THREE.Mesh(new THREE.ConeGeometry(60+r()*50,70+r()*60,6),new THREE.MeshStandardMaterial({color:0x6d7f9a,flatShading:true,fog:true}));m.position.set(Math.cos(a)*330,20,Math.sin(a)*330);world.add(m)}
 scene.add(world);
}
function collide(x,z){
 const R=.45;
 for(let it=0;it<2;it++){
  x=Math.max(-LIM,Math.min(LIM,x));z=Math.max(-LIM,Math.min(LIM,z));
  for(const b of obst){
   if(b.r!==undefined){const dx=x-b.x,dz=z-b.z,d=Math.hypot(dx,dz),m=b.r+R;if(d<m&&d>1e-4){x=b.x+dx/d*m;z=b.z+dz/d*m}}
   else{const cx=Math.max(b.x0,Math.min(x,b.x1)),cz=Math.max(b.z0,Math.min(z,b.z1)),dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;
    if(d2<R*R){if(d2>1e-8){const d=Math.sqrt(d2);x=cx+dx/d*R;z=cz+dz/d*R}
     else{const l=x-b.x0,rt=b.x1-x,tp=z-b.z0,bt=b.z1-z,m=Math.min(l,rt,tp,bt);if(m===l)x=b.x0-R;else if(m===rt)x=b.x1+R;else if(m===tp)z=b.z0-R;else z=b.z1+R}}}
  }
 }
 return[x,z];
}
function mkAvatar(p){
 const isS=p.id===seekerId,c=isS?0xff3b3b:new THREE.Color().setHSL((p.id*.19+.05)%1,.65,.5).getHex();
 const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:c,roughness:.5,emissive:isS?0x551111:0});
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.34,.38,1.2,12),m),h=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12),new THREE.MeshStandardMaterial({color:0xf0c8a0,roughness:.6}));
 b.position.y=.8;h.position.y=1.65;b.castShadow=h.castShadow=true;g.add(b,h);
 const cv=document.createElement('canvas');cv.width=256;cv.height=64;const x=cv.getContext('2d');x.font='700 34px "Trebuchet MS",sans-serif';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=6;
 x.strokeText(p.name,128,44);x.fillText(p.name,128,44);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));sp.scale.set(2.4,.6,1);sp.position.y=2.3;g.add(sp);
 return g;
}

/* ---------- round flow ---------- */
function beginRound(m){
 initGL();buildWorld(m.seed);
 seekerId=m.seeker;round=m.round;found=false;phase='hide';tl=HIDE;
 while(avatars.children.length)avatars.remove(avatars.children[0]);
 players=Object.fromEntries(m.list.map(e=>{const old=players[e.id],p=old||newP(e.id,e.name);p.name=e.name;p.found=false;return[e.id,p]}));
 for(const id in players){const p=players[id],s=m.sp[id];p.x=p.tx=s[0];p.z=p.tz=s[1];p.ry=p.tr=0;
  if(+id!==myId){p.mesh=mkAvatar(p);p.mesh.position.set(p.x,0,p.z);avatars.add(p.mesh)}}
 const me=m.sp[myId];px=me[0];pz=me[1];yaw=myId===seekerId?0:Math.random()*6.28;pitch=0;
 $('end').classList.remove('on');['home','lobby'].forEach(s=>$(s).classList.remove('on'));
 $('map').style.display=$('mapShade').style.display='none';document.querySelectorAll('.pin').forEach(p=>p.style.display='none');
 $('game').style.display='block';$('hud').classList.add('on');
 $('tagBtn').style.display=(TOUCH&&myId===seekerId)?'block':'none';
 $('role').textContent=myId===seekerId?'You are the seeker':'You are hiding';
 inGame=true;resize();
 if(!isHost){clearInterval(tickH);tickH=setInterval(()=>{if(inGame&&hostConn&&hostConn.open&&!found)hostConn.send({t:'p',x:+px.toFixed(2),z:+pz.toFixed(2),r:+yaw.toFixed(2)})},66)}
 else if(!tickH)tickH=setInterval(hostTick,66);
 $('hint').textContent=TOUCH?'Left side: move. Right side: look.':'WASD move, Shift run, mouse look (click to capture). E or click to tag.';
}
let toastT=0;
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,2600)}
function doTag(){if(myId!==seekerId||phase!=='seek')return;if(isHost)hostTag(0);else hostConn&&hostConn.open&&hostConn.send({t:'tag'})}

/* ---------- input ---------- */
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'&&inGame)doTag()});
addEventListener('keyup',e=>{keys[e.code]=false});
$('game').addEventListener('click',()=>{if(!TOUCH&&inGame&&phase!=='over'){if(document.pointerLockElement===$('game'))doTag();else $('game').requestPointerLock()}});
addEventListener('mousemove',e=>{if(document.pointerLockElement===$('game')){yaw-=e.movementX*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0022))}});
let joyId=null,joyO=null,lookId=null,lookP=null;
const joy=$('joy');
$('game').addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  if(t.clientX<innerWidth*.5&&joyId===null){joyId=t.identifier;joyO=[t.clientX,t.clientY];joy.style.cssText='display:block;left:'+t.clientX+'px;top:'+t.clientY+'px'}
  else if(lookId===null){lookId=t.identifier;lookP=[t.clientX,t.clientY]}
 }},{passive:false});
$('game').addEventListener('touchmove',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  if(t.identifier===joyId){let dx=t.clientX-joyO[0],dy=t.clientY-joyO[1];const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}
   jx=dx/m;jy=-dy/m;joy.firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)'}
  else if(t.identifier===lookId){yaw-=(t.clientX-lookP[0])*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-(t.clientY-lookP[1])*.005));lookP=[t.clientX,t.clientY]}
 }},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){
 if(t.identifier===joyId){joyId=null;jx=jy=0;joy.style.display='none';joy.firstElementChild.style.transform=''}
 if(t.identifier===lookId)lookId=null}};
$('game').addEventListener('touchend',tEnd);$('game').addEventListener('touchcancel',tEnd);
$('tagBtn').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();doTag()},{passive:false});
$('tagBtn').addEventListener('click',doTag);

/* ---------- main loop ---------- */
let last=0;
function loop(t){
 requestAnimationFrame(loop);
 if(!inGame||!renderer)return;
 const dt=Math.min(.05,(t-last)/1000||.016);last=t;
 const isS=myId===seekerId,canMove=!found&&(phase==='seek'||(phase==='hide'&&!isS));
 if(canMove){
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+jy,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
  const l=Math.hypot(f,s);if(l>1){f/=l;s/=l}
  const run=keys.ShiftLeft||keys.ShiftRight||l>.92&&TOUCH,sp=(run?9:5.5)*dt,sn=Math.sin(yaw),cs=Math.cos(yaw);
  const r=collide(px+(-sn*f+cs*s)*sp,pz+(-cs*f-sn*s)*sp);px=r[0];pz=r[1];
 }
 for(const id in players){const p=players[id];if(+id===myId||!p.mesh)continue;
  const k=Math.min(1,dt*12);p.x+=(p.tx-p.x)*k;p.z+=(p.tz-p.z)*k;let dr=p.tr-p.ry;dr=Math.atan2(Math.sin(dr),Math.cos(dr));p.ry+=dr*k;
  p.mesh.position.set(p.x,0,p.z);p.mesh.rotation.y=p.ry+Math.PI;p.mesh.visible=!p.found;}
 clock+=dt;camera.position.set(px,1.7+(canMove&&(Math.abs(jy)+Math.abs(jx)>0||keys.KeyW||keys.KeyS)?Math.sin(clock*11)*.04:0),pz);
 camera.rotation.set(pitch,yaw,0);
 sun.position.set(px+60,90,pz+35);sun.target.position.set(px,0,pz);
 renderer.render(scene,camera);
 hudT+=dt;if(hudT>.1){hudT=0;updateHud()}
}
function updateHud(){
 const t=Math.ceil(phase==='hide'?SEEK:phase==='seek'?tl:0),isS=myId===seekerId;
 $('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
 const hid=Object.values(players).filter(p=>p.id!==seekerId);
 $('cnt').textContent='Found '+hid.filter(p=>p.found).length+'/'+hid.length;
 const b=$('banner');
 if(phase==='hide'){b.style.display='flex';b.className=isS?'blind':'';b.textContent=isS?'Hiders are hiding... '+Math.ceil(tl)+'s':'Hide! Seeker starts in '+Math.ceil(tl)+'s'}
 else b.style.display='none';
 $('cross').style.display=isS?'block':'none';
}
requestAnimationFrame(loop);

/* ---------- buttons ---------- */
$('mk').onclick=makeRoom;
$('jn').onclick=()=>{const b=$('joinBox');b.style.display=b.style.display==='none'?'flex':'none';if(b.style.display==='flex')$('code').focus()};
$('go').onclick=joinRoom;
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
$('code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});
$('start').onclick=startRound;
$('leave').onclick=()=>{cleanup();show('home')};
$('back').onclick=()=>{if(!isHost)return;phase='lobby';leaveGame();bcast(lobbyMsg());renderLobby();show('lobby')};
</script></body></html>
